<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Call — Huddle</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0a0f; --card: #1a1a24; --border: #252535;
      --accent: #6c63ff; --text: #eeeef5; --muted: #5c5c72; --red: #f87171;
      --topbar-h: calc(52px + env(safe-area-inset-top, 0px));
      --btmbar-h: calc(72px + env(safe-area-inset-bottom, 0px));
    }
    html, body {
      height: 100%; height: 100dvh;
      background: var(--bg); color: var(--text);
      font-family: 'DM Sans', sans-serif;
      overflow: hidden; touch-action: manipulation;
    }

    /* ── Error shield ── */
    #error-shield {
      display: none; position: fixed; inset: 0; z-index: 9999;
      background: var(--bg); flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center; padding: 2rem; gap: 1rem;
    }
    #error-shield.show { display: flex; }
    .err-icon  { font-size: 2.5rem; }
    .err-title { font-size: 1.1rem; font-weight: 700; }
    .err-msg   { font-size: 0.82rem; color: var(--muted); max-width: 280px; line-height: 1.6; }
    .err-btn {
      margin-top: 0.5rem; padding: 0 1.5rem; height: 48px;
      background: var(--accent); color: #fff; border: none;
      border-radius: 0.75rem; font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem; font-weight: 600; cursor: pointer;
    }

    /* ── Top bar ── */
    .topbar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 10;
      padding-top: env(safe-area-inset-top, 0px);
      background: rgba(10,10,15,0.95);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
    }
    .topbar-inner {
      display: flex; align-items: center;
      height: 52px; padding: 0 1.1rem; gap: 0.75rem;
    }
    .topbar-logo {
      display: flex; align-items: center; gap: 0.45rem;
      font-size: 0.88rem; font-weight: 700;
      text-decoration: none; color: var(--text);
      min-height: 44px;
    }
    .topbar-logo-icon {
      width: 24px; height: 24px; border-radius: 6px;
      background: linear-gradient(135deg, #6c63ff, #a78bfa);
      display: flex; align-items: center; justify-content: center;
      font-size: 0.65rem;
    }
    .topbar-room {
      font-size: 0.82rem; color: var(--muted); font-weight: 500;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      flex: 1; min-width: 0;
    }
    .topbar-room::before { content: '·'; margin-right: 0.4rem; color: var(--border); }

    /* live indicator dot */
    .live-badge {
      display: flex; align-items: center; gap: 0.3rem;
      font-size: 0.68rem; font-weight: 600; color: var(--red);
      background: rgba(248,113,113,0.1);
      border: 1px solid rgba(248,113,113,0.25);
      padding: 0.2rem 0.55rem; border-radius: 20px;
      flex-shrink: 0;
    }
    .live-badge::before {
      content: '●'; font-size: 0.45rem;
      animation: livePulse 1.5s ease-in-out infinite;
    }
    @keyframes livePulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

    /* ── Call iframe ── */
    #call-frame {
      position: fixed;
      top: var(--topbar-h);
      left: 0; right: 0;
      bottom: var(--btmbar-h);
      width: 100%;
      height: calc(100dvh - var(--topbar-h) - var(--btmbar-h));
      min-height: calc(100dvh - var(--topbar-h) - var(--btmbar-h));
      border: none;
      display: none;
      background: #000;
    }

    /* ── Bottom action bar ── */
    .btmbar {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 10;
      padding-bottom: env(safe-area-inset-bottom, 0px);
      background: rgba(10,10,15,0.95);
      backdrop-filter: blur(14px);
      border-top: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      padding-left: 1.25rem; padding-right: 1.25rem;
      padding-top: 0.65rem;
      min-height: var(--btmbar-h);
    }

    /* Leave button — two states */
    .btn-leave {
      display: flex; align-items: center; justify-content: center; gap: 0.45rem;
      height: 48px; border-radius: 0.85rem;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem; font-weight: 600;
      cursor: pointer; border: none;
      -webkit-tap-highlight-color: transparent;
      transition: all 0.2s;
      width: 100%; max-width: 340px;
    }

    /* default state */
    .btn-leave {
      background: rgba(248,113,113,0.1);
      color: var(--red);
      border: 1px solid rgba(248,113,113,0.28);
    }
    .btn-leave:active { transform: scale(0.97); }

    /* armed (confirm) state */
    .btn-leave.armed {
      background: var(--red);
      color: #fff;
      border-color: var(--red);
      box-shadow: 0 4px 20px rgba(248,113,113,0.4);
      animation: armedPulse 0.6s ease both;
    }
    @keyframes armedPulse {
      from { transform: scale(0.97); }
      to   { transform: scale(1); }
    }

    /* countdown ring inside button */
    .btn-leave-inner {
      display: flex; align-items: center; gap: 0.45rem;
      pointer-events: none;
    }
    .leave-countdown {
      display: none;
      width: 18px; height: 18px;
    }
    .btn-leave.armed .leave-countdown { display: block; }
    .countdown-circle {
      fill: none; stroke: rgba(255,255,255,0.5);
      stroke-width: 2; stroke-dasharray: 50;
      stroke-dashoffset: 0;
      stroke-linecap: round;
      transform-origin: center;
      transform: rotate(-90deg);
      transition: stroke-dashoffset 3s linear;
    }
    .countdown-circle.running { stroke-dashoffset: 50; }

    /* ── Loading screen ── */
    #loading-screen {
      position: fixed;
      top: var(--topbar-h); bottom: var(--btmbar-h);
      left: 0; right: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 1rem;
      background: var(--bg);
    }
    .spinner {
      width: 36px; height: 36px; border-radius: 50%;
      border: 3px solid var(--border); border-top-color: var(--accent);
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { font-size: 0.88rem; color: var(--muted); }

    /* ── Auth guard ── */
    #guard-screen {
      position: fixed;
      top: var(--topbar-h); bottom: var(--btmbar-h);
      left: 0; right: 0;
      display: none; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 1rem; background: var(--bg);
      text-align: center; padding: 2rem;
    }
    #guard-screen h2 { font-size: 1.15rem; font-weight: 700; }
    #guard-screen p  { font-size: 0.88rem; color: var(--muted); line-height: 1.5; }
    .btn-go-login {
      background: var(--accent); color: #fff; border: none;
      border-radius: 0.75rem; padding: 0 2rem; height: 52px;
      font-family: 'DM Sans', sans-serif; font-size: 0.95rem; font-weight: 600;
      cursor: pointer; min-width: 180px;
    }
    .btn-go-login:active { transform: scale(0.97); background: #5a52e0; }
  </style>
</head>
<body>

<!-- Error shield -->
<div id="error-shield">
  <div class="err-icon">😕</div>
  <div class="err-title">Something went wrong</div>
  <div class="err-msg" id="err-detail">An unexpected error occurred.</div>
  <button class="err-btn" onclick="window.location.href='dashboard.html'">Back to Dashboard</button>
</div>

<!-- Top bar -->
<div class="topbar">
  <div class="topbar-inner">
    <a class="topbar-logo" href="dashboard.html">
      <div class="topbar-logo-icon">📹</div>
      Huddle
    </a>
    <span class="topbar-room" id="room-name-display"></span>
    <span class="live-badge" id="live-badge" style="display:none">Live</span>
  </div>
</div>

<!-- Loading -->
<div id="loading-screen">
  <div class="spinner"></div>
  <p class="loading-text">Verifying access…</p>
</div>

<!-- Auth guard -->
<div id="guard-screen">
  <h2>🔒 Sign in required</h2>
  <p>You need to be logged in to join this call.</p>
  <button class="btn-go-login" onclick="window.location.href='auth.html'">Go to Sign In</button>
</div>

<!-- Call iframe -->
<iframe id="call-frame"
  allow="camera; microphone; fullscreen; display-capture; autoplay"
  allowfullscreen>
</iframe>

<!-- Bottom bar -->
<div class="btmbar">
  <button class="btn-leave" id="leave-btn">
    <div class="btn-leave-inner">
      <!-- countdown SVG ring (shown when armed) -->
      <svg class="leave-countdown" viewBox="0 0 18 18">
        <circle cx="9" cy="9" r="7" class="countdown-circle" id="countdown-ring"/>
      </svg>
      <span id="leave-label">⬅ Leave Call</span>
    </div>
  </button>
</div>

<!-- ── Error shield (plain, runs first) ── -->
<script>
(function() {
  function showError(msg) {
    var s = document.getElementById('error-shield');
    var d = document.getElementById('err-detail');
    var l = document.getElementById('loading-screen');
    if (l) l.style.display = 'none';
    if (d && msg) d.textContent = msg;
    if (s) s.classList.add('show');
  }
  window.onerror = function(msg, src) {
    if (src && (src.indexOf('fonts.googleapis')!==-1 || src.indexOf('jsdelivr')!==-1)) return false;
    showError('An unexpected error occurred. Tap below to go back.');
    return true;
  };
  window.addEventListener('unhandledrejection', function(e) {
    var msg = e && e.reason && e.reason.message ? e.reason.message : '';
    if (msg.indexOf('401')!==-1 || msg.toLowerCase().indexOf('unauthorized')!==-1 ||
        msg.toLowerCase().indexOf('missing scope')!==-1) return;
    if (msg.toLowerCase().indexOf('network')!==-1 || msg.toLowerCase().indexOf('fetch')!==-1) {
      showError('No internet connection. Please check your network.');
    }
  });
  // Android back — leave the call and return to dashboard
  window.handleAndroidBack = function() {
    var frame = document.getElementById('call-frame');
    if (frame) frame.src = '';
    window.location.href = 'dashboard.html';
  };
})();
</script>

<!-- ── Leave button logic (plain, zero dependencies) ── -->
<script>
(function() {
  var btn        = document.getElementById('leave-btn');
  var label      = document.getElementById('leave-label');
  var ring       = document.getElementById('countdown-ring');
  var resetTimer = null;

  btn.addEventListener('click', function() {
    if (btn.classList.contains('armed')) {
      // Second tap — leave
      clearTimeout(resetTimer);
      var frame = document.getElementById('call-frame');
      if (frame) frame.src = '';
      window.location.href = 'dashboard.html';
    } else {
      // First tap — arm the button
      btn.classList.add('armed');
      label.textContent = 'Tap again to leave';

      // Start countdown ring animation
      requestAnimationFrame(function() {
        ring.classList.add('running');
      });

      // Auto-disarm after 3 seconds
      resetTimer = setTimeout(function() {
        btn.classList.remove('armed');
        label.textContent = '⬅ Leave Call';
        ring.classList.remove('running');
        // Reset stroke-dashoffset for next arm
        ring.style.transition = 'none';
        ring.style.strokeDashoffset = '0';
        requestAnimationFrame(function() {
          ring.style.transition = '';
        });
      }, 3000);
    }
  });
})();
</script>

<!-- ── Auth + call init (module, isolated) ── -->
<script type="module">
(async function() {
  var loadingScreen = document.getElementById('loading-screen');
  var guardScreen   = document.getElementById('guard-screen');
  var callFrame     = document.getElementById('call-frame');
  var liveBadge     = document.getElementById('live-badge');

  var params   = new URLSearchParams(window.location.search);
  var roomUrl  = params.get('url');
  var roomName = params.get('name') || 'Call';
  document.getElementById('room-name-display').textContent = roomName;

  try {
    var mod      = await import('./Scripts/config.js');
    var APPWRITE = mod.APPWRITE;
    var DAILY    = mod.DAILY;
    var sdk      = await import('https://cdn.jsdelivr.net/npm/appwrite@16/dist/esm/sdk.js');
    var client   = new sdk.Client().setEndpoint(APPWRITE.endpoint).setProject(APPWRITE.projectId);
    var account  = new sdk.Account(client);

    var user;
    try {
      user = await account.get();
    } catch(_) {
      loadingScreen.style.display = 'none';
      guardScreen.style.display   = 'flex';
      return;
    }

    if (!roomUrl) {
      loadingScreen.style.display = 'none';
      guardScreen.innerHTML = `
        <h2>⚠️ No room specified</h2>
        <p>Please go back to the dashboard and select a room.</p>
        <button class="btn-go-login" onclick="window.location.href='dashboard.html'">Back to Dashboard</button>`;
      guardScreen.style.display = 'flex';
      return;
    }

    var displayName = user.name || user.email || 'Guest';

    // ── Private room: generate a meeting token ──────────────────
    // Daily room name is the last path segment of the room URL
    // e.g. https://yourdomain.daily.co/my-room → "my-room"
    var dailyRoomName = roomUrl.split('?')[0].split('/').filter(Boolean).pop();
    var meetingToken  = '';

    try {
      var tokenRes = await fetch('https://api.daily.co/v1/meeting-tokens', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + DAILY.apiKey,
        },
        body: JSON.stringify({
          properties: {
            room_name: dailyRoomName,
            user_name: displayName,
            exp: Math.floor(Date.now() / 1000) + 60 * 60 * 4, // token valid 4 hours
          },
        }),
      });

      if (tokenRes.ok) {
        var tokenData = await tokenRes.json();
        meetingToken  = tokenData.token || '';
      } else {
        console.warn('Meeting token request failed:', await tokenRes.text());
      }
    } catch (tokenErr) {
      console.warn('Could not fetch meeting token:', tokenErr.message);
    }

    var sep     = roomUrl.includes('?') ? '&' : '?';
    var callUrl = roomUrl + sep + 'showLeaveButton=0&userName=' + encodeURIComponent(displayName);
    if (meetingToken) {
      callUrl += '&t=' + encodeURIComponent(meetingToken);
    }

    callFrame.src = callUrl;
    callFrame.addEventListener('load', function() {
      loadingScreen.style.display = 'none';
      callFrame.style.display     = 'block';
      liveBadge.style.display     = 'flex';
    });

    // Fallback: show frame after 6s even if load event doesn't fire
    setTimeout(function() {
      if (loadingScreen.style.display !== 'none') {
        loadingScreen.style.display = 'none';
        callFrame.style.display     = 'block';
        liveBadge.style.display     = 'flex';
      }
    }, 6000);

  } catch(e) {
    loadingScreen.style.display = 'none';
    var shield = document.getElementById('error-shield');
    var detail = document.getElementById('err-detail');
    if (detail) detail.textContent = 'Could not connect to the server. Please check your connection.';
    if (shield) shield.classList.add('show');
  }
})();
</script>

</body>
</html>
