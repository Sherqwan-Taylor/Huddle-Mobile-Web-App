<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>Huddle</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet"/>
  <style>
      /* ── Production Web Mask Overlay ── */
      #app-veil {
          position: fixed;
          top: 0;
          left: 0;
          width: 100vw;
          height: 100vh;
          background-color: #08080d; /* Matches your exact var(--bg) */
          z-index: 99999; /* Higher than any other UI layers */
          display: flex;
          flex-direction: column;
          justify-content: center;
          align-items: center;
          opacity: 1;
          transition: opacity 0.4s cubic-bezier(0.25, 1, 0.5, 1), visibility 0.4s;
          pointer-events: all;
      }

      /* Spinner element inside the mask */
      .veil-spinner {
          width: 42px;
          height: 42px;
          border: 3px solid rgba(108, 99, 255, 0.15); /* Faint accent color */
          border-top-color: #6c63ff; /* Full accent color */
          border-radius: 50%;
          animation: veil-spin 1s linear infinite;
      }

      #app-veil.hidden {
          opacity: 0;
          visibility: hidden;
          pointer-events: none;
      }

      @keyframes veil-spin {
          to {
              transform: rotate(360deg);
          }
      }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #08080d; --accent: #6c63ff; --accent2: #a78bfa;
      --text: #eeeef5; --muted: #5c5c72; --border: #1e1e2e; --red: #f87171;
    }
    html { touch-action: manipulation; height: 100%; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100dvh; height: 100%;
      display: flex; flex-direction: column; overflow: hidden;
      padding: env(safe-area-inset-top,0px) env(safe-area-inset-right,0px)
               env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px);
    }

    /* ── Error shield ── */
    #error-shield {
      display: none; position: fixed; inset: 0; z-index: 9999;
      background: var(--bg); flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center; padding: 2rem;
      gap: 1rem;
    }
    #error-shield.show { display: flex; }
    .err-icon { font-size: 2.5rem; }
    .err-title { font-size: 1.1rem; font-weight: 700; }
    .err-msg { font-size: 0.82rem; color: var(--muted); max-width: 280px; line-height: 1.6; }
    .err-btn {
      margin-top: 0.5rem; padding: 0 1.5rem; height: 48px;
      background: var(--accent); color: #fff; border: none;
      border-radius: 0.75rem; font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem; font-weight: 600; cursor: pointer;
    }

    /* ── Canvas ── */
    #bg-canvas { position: fixed; inset: 0; z-index: 0; }

    /* ── Glows ── */
    .glow { position: fixed; z-index: 1; border-radius: 50%; pointer-events: none; filter: blur(90px); }
    .glow-top {
      width: 380px; height: 320px;
      background: radial-gradient(circle, rgba(108,99,255,0.2), transparent 70%);
      top: -100px; left: 50%; transform: translateX(-50%);
      animation: driftA 9s ease-in-out infinite alternate;
    }
    .glow-btm {
      width: 280px; height: 280px;
      background: radial-gradient(circle, rgba(167,139,250,0.1), transparent 70%);
      bottom: 15%; right: -80px;
      animation: driftB 11s ease-in-out infinite alternate;
    }
    @keyframes driftA {
      from { transform: translateX(-50%) translateY(0); }
      to   { transform: translateX(-50%) translateY(28px); }
    }
    @keyframes driftB {
      from { transform: translate(0,0); } to { transform: translate(-22px,-20px); }
    }

    /* ── Layout ── */
    .wrap {
      position: relative; z-index: 2; flex: 1;
      display: flex; flex-direction: column;
      align-items: center; padding: 0 1.75rem;
    }
    .center {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center;
    }

    /* ── Logo ── */
    .logo-mark {
      position: relative;
      width: 84px; height: 84px; border-radius: 26px;
      background: linear-gradient(145deg, #7b72ff, #a78bfa);
      display: flex; align-items: center; justify-content: center;
      font-size: 2.4rem; margin-bottom: 1.6rem;
      box-shadow: 0 0 0 1px rgba(108,99,255,0.35), 0 0 50px rgba(108,99,255,0.3), 0 16px 40px rgba(0,0,0,0.5);
      animation: logoIn 0.6s cubic-bezier(0.22,1,0.36,1) both;
    }
    .logo-mark::after {
      content: ''; position: absolute; inset: -10px; border-radius: 34px;
      border: 1px solid rgba(108,99,255,0.25);
      animation: ringPulse 3s ease-in-out infinite;
    }
    @keyframes logoIn {
      from { opacity: 0; transform: scale(0.75) translateY(16px); }
      to   { opacity: 1; transform: scale(1) translateY(0); }
    }
    @keyframes ringPulse {
      0%,100% { opacity: 0.7; transform: scale(1); }
      50%      { opacity: 0;   transform: scale(1.18); }
    }

    .logo-name {
      font-family: 'DM Serif Display', serif;
      font-size: 3.2rem; letter-spacing: -0.03em;
      line-height: 1; margin-bottom: 0.85rem;
      animation: fadeUp 0.55s 0.1s cubic-bezier(0.22,1,0.36,1) both;
    }
    .tagline {
      font-size: 1rem; font-weight: 300; color: var(--muted);
      line-height: 1.55; max-width: 220px;
      animation: fadeUp 0.55s 0.18s cubic-bezier(0.22,1,0.36,1) both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Pills ── */
    .pills {
      display: flex; gap: 0.45rem; flex-wrap: wrap; justify-content: center;
      margin-top: 1.8rem;
      animation: fadeUp 0.55s 0.28s cubic-bezier(0.22,1,0.36,1) both;
    }
    .pill {
      display: flex; align-items: center; gap: 0.35rem;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 20px; padding: 0.38rem 0.8rem;
      font-size: 0.75rem; font-weight: 500; color: var(--muted);
    }
    .dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
    .dot-g { background: #34d399; box-shadow: 0 0 5px rgba(52,211,153,0.7); }
    .dot-p { background: var(--accent2); box-shadow: 0 0 5px rgba(167,139,250,0.6); }
    .dot-b { background: #60a5fa; box-shadow: 0 0 5px rgba(96,165,250,0.6); }

    /* ── CTAs ── */
    .cta-zone {
      width: 100%;
      padding-bottom: max(2.25rem, env(safe-area-inset-bottom,0px));
      display: flex; flex-direction: column; gap: 0.7rem;
      animation: fadeUp 0.55s 0.38s cubic-bezier(0.22,1,0.36,1) both;
    }
    .btn {
      width: 100%; min-height: 56px; border-radius: 1rem;
      font-family: 'DM Sans', sans-serif;
      font-size: 1rem; font-weight: 600; letter-spacing: -0.01em;
      cursor: pointer; border: none;
      -webkit-tap-highlight-color: transparent;
      transition: transform 0.12s, opacity 0.12s;
    }
    .btn:active { transform: scale(0.97); opacity: 0.88; }
    .btn-primary {
      background: linear-gradient(135deg, #7b72ff 0%, #a78bfa 100%);
      color: #fff; box-shadow: 0 8px 28px rgba(108,99,255,0.45);
    }
    .btn-secondary {
      background: rgba(255,255,255,0.05); color: var(--text);
      border: 1px solid rgba(255,255,255,0.1);
    }
    .legal {
      text-align: center; font-size: 0.68rem;
      color: var(--muted); opacity: 0.5; line-height: 1.5;
    }
  </style>
</head>
<body>

    <div id="app-veil">
        <div class="veil-spinner"></div>
    </div>

    <!-- ══ ERROR SHIELD — runs before anything else ══ -->
    <div id="error-shield">
        <div class="err-icon">😕</div>
        <div class="err-title">Something went wrong</div>
        <div class="err-msg" id="err-detail">An unexpected error occurred. Please try again.</div>
        <button class="err-btn" onclick="window.location.reload()">Try Again</button>
    </div>

    <canvas id="bg-canvas"></canvas>
    <div class="glow glow-top"></div>
    <div class="glow glow-btm"></div>

    <div class="wrap">
        <div class="center">
            <div class="logo-mark">📹</div>
            <div class="logo-name">Huddle</div>
            <p class="tagline">Video calls, without the friction</p>
            <div class="pills">
                <div class="pill"><span class="dot dot-g"></span>No downloads</div>
                <div class="pill"><span class="dot dot-p"></span>Private rooms</div>
                <div class="pill"><span class="dot dot-b"></span>One tap to join</div>
            </div>
        </div>
        <div class="cta-zone">
            <button class="btn btn-primary" id="btn-start">Get Started — it's free</button>
            <button class="btn btn-secondary" id="btn-signin">Sign In</button>
            <p class="legal">No credit card required &nbsp;·&nbsp; Works in any browser</p>
        </div>
    </div>

    <!-- ── 1. Error shield (plain script, runs synchronously first) ── -->
    <script>
        (function () {
            function showError(msg) {
                var shield = document.getElementById('error-shield');
                var detail = document.getElementById('err-detail');
                if (!shield) return;
                if (detail && msg) detail.textContent = msg;
                shield.classList.add('show');
            }
            // Catch synchronous JS errors
            window.onerror = function (msg, src, line, col, err) {
                // Don't surface network/font errors as app crashes
                if (src && (src.indexOf('fonts.googleapis') !== -1 || src.indexOf('jsdelivr') !== -1)) return false;
                showError('An unexpected error occurred. The app will reload.');
                setTimeout(function () { window.location.reload(); }, 3000);
                return true;
            };
            // Catch async/promise errors
            window.addEventListener('unhandledrejection', function (e) {
                var msg = e && e.reason && e.reason.message ? e.reason.message : null;
                // Appwrite auth failures are expected (not-logged-in), never surface them
                if (msg && (msg.indexOf('401') !== -1 || msg.toLowerCase().indexOf('unauthorized') !== -1 ||
                    msg.toLowerCase().indexOf('missing scope') !== -1)) return;
                // Network offline — show friendly offline state instead
                if (msg && (msg.toLowerCase().indexOf('network') !== -1 || msg.toLowerCase().indexOf('fetch') !== -1)) {
                    showError('No internet connection. Please check your network and try again.');
                }
            });
        })();
    </script>

    <!-- ── 2. Canvas animation (plain script, zero dependencies) ── -->
    <script>
        (function () {
            var canvas = document.getElementById('bg-canvas');
            var ctx = canvas.getContext('2d');
            var W, H, nodes;
            var COUNT = 26, MAXD = 140, SPEED = 0.3;

            function resize() {
                W = canvas.width = window.innerWidth;
                H = canvas.height = window.innerHeight;
                if (!nodes) spawn();
            }
            function spawn() {
                nodes = [];
                for (var i = 0; i < COUNT; i++) {
                    nodes.push({
                        x: Math.random() * W, y: Math.random() * H,
                        vx: (Math.random() - 0.5) * SPEED, vy: (Math.random() - 0.5) * SPEED,
                        r: 1.5 + Math.random() * 1.5, hue: 245 + Math.random() * 55
                    });
                }
            }
            function tick() {
                ctx.clearRect(0, 0, W, H);
                for (var i = 0; i < nodes.length; i++) {
                    var n = nodes[i];
                    n.x += n.vx; n.y += n.vy;
                    if (n.x < 0 || n.x > W) n.vx *= -1;
                    if (n.y < 0 || n.y > H) n.vy *= -1;
                }
                for (var i = 0; i < nodes.length; i++) {
                    for (var j = i + 1; j < nodes.length; j++) {
                        var a = nodes[i], b = nodes[j];
                        var dx = a.x - b.x, dy = a.y - b.y;
                        var d = Math.sqrt(dx * dx + dy * dy);
                        if (d > MAXD) continue;
                        ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y);
                        ctx.strokeStyle = 'hsla(' + ((a.hue + b.hue) / 2) + ',65%,68%,' + ((1 - d / MAXD) * 0.15) + ')';
                        ctx.lineWidth = 0.8; ctx.stroke();
                    }
                }
                for (var i = 0; i < nodes.length; i++) {
                    var n = nodes[i];
                    ctx.beginPath(); ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
                    ctx.fillStyle = 'hsla(' + n.hue + ',70%,70%,0.4)'; ctx.fill();
                }
                requestAnimationFrame(tick);
            }
            window.addEventListener('resize', resize);
            resize(); tick();
        })();
    </script>

    <!-- ── 3. Button handlers (plain script, zero dependencies) ── -->
    <script>
        document.getElementById('btn-start').addEventListener('click', function () {
            try { sessionStorage.setItem('huddle_auth_mode', 'signup'); } catch (e) { }
            window.location.href = 'auth.html';
        });
        document.getElementById('btn-signin').addEventListener('click', function () {
            try { sessionStorage.setItem('huddle_auth_mode', 'login'); } catch (e) { }
            window.location.href = 'auth.html';
        });

        // Android back handler for MAUI
        window.handleAndroidBack = function () {
            if (typeof window.HybridWebView !== 'undefined') {
                window.HybridWebView.InvokeDotNet('CloseApplication');
            }
        };
    </script>

    <!-- ── 4. Auth check (module, fully isolated — if it fails nothing else breaks) ── -->
    <script type="module">
        import { APPWRITE } from './Scripts/config.js';

        // Session Interception Routine
        (async function() {
          const veil = document.getElementById('app-veil');

          try {
            var mod      = await import('./Scripts/config.js');
            var APPWRITE = mod.APPWRITE;
            if (!APPWRITE) {
                if (veil) veil.classList.add('hidden');
                return;
            }

            var sdk     = await import('https://cdn.jsdelivr.net/npm/appwrite@16/dist/esm/sdk.js');
            var client  = new sdk.Client().setEndpoint(APPWRITE.endpoint).setProject(APPWRITE.projectId);
            var account = new sdk.Account(client);

            await account.get();

            // Active Session Found! Skip loading the layout completely and move pages.
            // The veil layer stays up completely until the dashboard takes over.
            window.location.replace('dashboard.html');

          } catch(_) {
            // No session found (or network offline). Remove the veil cleanly to present the login options.
            if (veil) {
                veil.classList.add('hidden');
            }
          }
        })();
    </script>

</body>
</html>
